name: Migrate legacy portfolio assets

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/images/**'
      - 'public/blog-assets/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asset-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new portfolio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone legacy portfolio
        run: git clone --depth 1 https://github.com/guneyguven/guneyguven.github.io.git /tmp/legacy

      - name: Copy assets into repository
        run: |
          mkdir -p public/images public/blog-assets
          rsync -a --delete --exclude='.DS_Store' /tmp/legacy/images/ public/images/
          rsync -a --delete --exclude='.DS_Store' /tmp/legacy/Blog/blog_assets/ public/blog-assets/

      - name: Commit migrated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images public/blog-assets
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'Migrate legacy portfolio assets'
          git push
